title: Printserver
description: Laravel package that queues print jobs and lets a print box on location fetch them over HTTPS, so printers never have to be reachable from the internet.
url: https://arviddejong.github.io
baseurl: /printserver

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap

# Facts about the package, used by the structured data and llms.txt.
package:
  name: darvis/printserver
  repository: https://github.com/ArvidDeJong/printserver
  packagist: https://packagist.org/packages/darvis/printserver
  license_url: https://github.com/ArvidDeJong/printserver/blob/main/LICENSE
  requires: "PHP 8.2+, Laravel 11, 12 or 13"
  platforms: [Laravel]
  keywords: [laravel print server, remote printing, cups, ipp, zebra zpl, network printer security, print queue, raspberry pi print server]

# Developer credit in the footer and the structured data.
developer:
  company: ARVID.NL
  url: https://arvid.nl

color_scheme: light
search_enabled: true
heading_anchors: true

aux_links:
  GitHub: https://github.com/ArvidDeJong/printserver
  Packagist: https://packagist.org/packages/darvis/printserver
aux_links_new_tab: true

gh_edit_link: true
